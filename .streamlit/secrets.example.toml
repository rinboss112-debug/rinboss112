# Sao chép các phần cần dùng vào Streamlit Community Cloud → App settings → Secrets.
# Không đổi tên file này thành secrets.toml rồi commit lên GitHub.

# Tùy chọn: nếu bỏ trống hoặc xóa phần này, app không yêu cầu mật khẩu.
[app]
password = "THAY_BANG_MAT_KHAU_MANH"

# Bật trang /admin và mã truy cập riêng cho từng người dùng.
# Khi enable_access_control = true, mã người dùng thay thế mật khẩu [app].
[admin]
password = "MAT_KHAU_ADMIN_RAT_MANH"
enable_access_control = true

# Google Drive OAuth của tài khoản sở hữu Drive.
[google_drive]
client_id = "YOUR_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_CLIENT_SECRET"
refresh_token = "YOUR_REFRESH_TOKEN"
folder_name = "Amazon Product Scraper"

# Temu US Open API. Tạo app và cấp quyền Order Management + Order Fulfillment
# trong Temu Partner Platform. Không dùng mật khẩu Seller Center ở đây.
[temu]
app_key = "YOUR_TEMU_APP_KEY"
app_secret = "YOUR_TEMU_APP_SECRET"
access_token = "YOUR_TEMU_ACCESS_TOKEN"
endpoint = "https://openapi-b-us.temu.com/openapi/router"
display_timezone = "America/Los_Angeles"

# Tùy chọn: thông báo Telegram sau khi phiên chạy kết thúc.
[telegram]
bot_token = "YOUR_TELEGRAM_BOT_TOKEN"
chat_id = "YOUR_CHAT_ID"

# Tùy chọn: thông báo email qua SMTP.
[email]
host = "smtp.gmail.com"
port = 465
use_ssl = true
username = "you@example.com"
password = "YOUR_APP_PASSWORD"
sender = "you@example.com"
recipient = "you@example.com"
