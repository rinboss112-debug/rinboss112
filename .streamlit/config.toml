[theme]
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#FFFCF8"
secondaryBackgroundColor = "#FFF4E8"
codeBackgroundColor = "#FFF0DD"
textColor = "#172554"
linkColor = "#B45309"
borderColor = "#F2C99D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
linkUnderline = false
blueColor = "#1E3A5F"
greenColor = "#15803D"
redColor = "#B42318"
yellowColor = "#D97706"
orangeColor = "#C2410C"
violetColor = "#7C3AED"
grayColor = "#64748B"
chartCategoricalColors = ["#C2410C", "#1E3A5F", "#15803D", "#D97706", "#0E7490", "#7C3AED"]
chartSequentialColors = ["#FFF7ED", "#FFEDD5", "#FED7AA", "#FDBA74", "#FB923C", "#F97316", "#EA580C", "#C2410C", "#9A3412", "#7C2D12"]
dataframeBorderColor = "#F2C99D"
dataframeHeaderBackgroundColor = "#FFF0DD"

[theme.sidebar]
backgroundColor = "#172554"
secondaryBackgroundColor = "#243B68"
codeBackgroundColor = "#1E315C"
textColor = "#FFF7ED"
borderColor = "#334A76"
primaryColor = "#FB923C"

[server]
headless = true

[browser]
gatherUsageStats = false
